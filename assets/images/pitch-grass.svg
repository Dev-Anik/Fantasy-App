<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="none">
  <!-- Pitch grass: gradient and lighting only. Safe to stretch to any shape;
       the markings are drawn separately so they never distort. -->
  <defs>
    <!-- Base grass gradient: rich stadium green -->
    <linearGradient id="grassBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b3815" />
      <stop offset="25%" stop-color="#155923" />
      <stop offset="50%" stop-color="#1d6c2d" />
      <stop offset="75%" stop-color="#145923" />
      <stop offset="100%" stop-color="#0a3313" />
    </linearGradient>

    <!-- Center highlight radial gradient for 3D lighting: kept faint and wide,
         so it lifts the middle without drawing a dark oval round the edges. -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08" />
    </radialGradient>

    <!-- Goal net pattern for 3D goal mesh -->
    <pattern id="goalNet" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="600" height="800" fill="url(#grassBg)" />
  <rect width="600" height="800" fill="url(#centerGlow)" />
</svg>
