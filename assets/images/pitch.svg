<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Base grass gradient: rich stadium green -->
    <linearGradient id="grassBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b3815" />
      <stop offset="25%" stop-color="#155923" />
      <stop offset="50%" stop-color="#1d6c2d" />
      <stop offset="75%" stop-color="#145923" />
      <stop offset="100%" stop-color="#0a3313" />
    </linearGradient>

    <!-- Center highlight radial gradient for 3D lighting -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </radialGradient>

    <!-- Goal net pattern for 3D goal mesh -->
    <pattern id="goalNet" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Ground Base -->
  <rect width="600" height="800" fill="url(#grassBg)" />

  <!-- Vertical Lawn Stripes (Alternating Mowed Grass) -->
  <g opacity="0.08">
    <rect x="0" width="50" height="800" fill="#ffffff" />
    <rect x="100" width="50" height="800" fill="#ffffff" />
    <rect x="200" width="50" height="800" fill="#ffffff" />
    <rect x="300" width="50" height="800" fill="#ffffff" />
    <rect x="400" width="50" height="800" fill="#ffffff" />
    <rect x="500" width="50" height="800" fill="#ffffff" />
  </g>
  <g opacity="0.07">
    <rect x="50" width="50" height="800" fill="#000000" />
    <rect x="150" width="50" height="800" fill="#000000" />
    <rect x="250" width="50" height="800" fill="#000000" />
    <rect x="350" width="50" height="800" fill="#000000" />
    <rect x="450" width="50" height="800" fill="#000000" />
    <rect x="550" width="50" height="800" fill="#000000" />
  </g>

  <!-- Lighting & Vignette Overlay -->
  <rect width="600" height="800" fill="url(#centerGlow)" />

  <!-- Pitch Side Touchlines & Top Goal Line -->
  <path d="M 25 800 L 25 32 L 575 32 L 575 800" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5" />

  <!-- Halfway Line (Positioned Lower) -->
  <line x1="25" y1="430" x2="575" y2="430" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5" />

  <!-- Center Circle & Spot (Positioned Lower) -->
  <circle cx="300" cy="430" r="75" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5" />
  <circle cx="300" cy="430" r="3.5" fill="#ffffff" fill-opacity="0.6" />

  <!-- TOP PENALTY AREA (YOUR GOAL) -->
  <!-- Penalty Box -->
  <rect x="150" y="32" width="300" height="135" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5" />
  <!-- 6-Yard Box -->
  <rect x="220" y="32" width="160" height="48" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5" />
  <!-- Penalty Spot -->
  <circle cx="300" cy="122" r="3" fill="#ffffff" fill-opacity="0.6" />
  <!-- Penalty Arc -->
  <path d="M 235 167 A 70 70 0 0 0 365 167" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5" />

  <!-- TOP 3D GOAL POST & NET -->
  <!-- Goal Net Backing (3D Perspective) -->
  <polygon points="215,8 385,8 400,32 200,32" fill="url(#goalNet)" />
  <polygon points="215,8 385,8 400,32 200,32" fill="rgba(255,255,255,0.12)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5" />
  <!-- Goal Posts and Crossbar -->
  <path d="M 200 32 L 200 8 L 400 8 L 400 32" fill="none" stroke="#ffffff" stroke-opacity="0.95" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="200" y1="8" x2="215" y2="8" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3" />
  <line x1="400" y1="8" x2="385" y2="8" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3" />

  <!-- BOTTOM OPPONENT D-BOX AREA (SMALLER & LOWER DOWN) -->
  <!-- 18-Yard Box Top Line -->
  <line x1="170" y1="670" x2="430" y2="670" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5" />
  <!-- 18-Yard Box Side Lines (Extending Downward Off Pitch) -->
  <line x1="170" y1="670" x2="170" y2="800" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5" />
  <line x1="430" y1="670" x2="430" y2="800" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5" />
  <!-- Penalty Spot -->
  <circle cx="300" cy="725" r="3" fill="#ffffff" fill-opacity="0.6" />
  <!-- Compact Opponent D-Box Arc -->
  <path d="M 250 670 A 50 50 0 0 1 350 670" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5" />

  <!-- CORNER ARCS (TOP ONLY) -->
  <path d="M 25 52 A 20 20 0 0 0 45 32" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5" />
  <path d="M 555 32 A 20 20 0 0 0 575 52" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5" />
</svg>