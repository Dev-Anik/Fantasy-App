<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" preserveAspectRatio="none">
  <!-- Match Hero card (a big score on the points page): holographic violet and
       cyan pinstripes and light rays over the club background, drawn behind
       the player. Card outline as in card-shield.svg. -->
  <defs>
    <clipPath id="shield">
      <path d="M8 1.5 H92 Q98.5 1.5 98.5 8 V112 Q98.5 118.5 92 118.5 H8 Q1.5 118.5 1.5 112 V8 Q1.5 1.5 8 1.5 Z" />
    </clipPath>
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5ad8" />
      <stop offset="50%" stop-color="#8a6bff" />
      <stop offset="100%" stop-color="#3fe0ff" />
    </linearGradient>
    <pattern id="stripes" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-32)">
      <rect width="1.4" height="5" fill="#d9c8ff" fill-opacity="0.3" />
    </pattern>
    <radialGradient id="glow" cx="15%" cy="8%" r="95%">
      <stop offset="0%" stop-color="#e8b8ff" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#8a6bff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#3fe0ff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <g clip-path="url(#shield)">
    <rect width="100" height="120" fill="url(#holo)" fill-opacity="0.24" />
    <rect width="100" height="120" fill="url(#stripes)" />
    <rect width="100" height="120" fill="url(#glow)" />
    <!-- Light beams fanning from the top-left corner. -->
    <g fill="#f2e6ff" fill-opacity="0.15">
      <polygon points="0,0 56,120 70,120" />
      <polygon points="0,0 100,70 100,92" />
      <polygon points="0,0 28,120 38,120" />
    </g>
  </g>
</svg>
