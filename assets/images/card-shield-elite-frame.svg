<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" preserveAspectRatio="none">
  <!-- Elite card (very good form): gold foil border and sparkles, drawn over
       everything else on the card. Card outline as in card-shield.svg. -->
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b8" />
      <stop offset="35%" stop-color="#f7c843" />
      <stop offset="60%" stop-color="#fff0a8" />
      <stop offset="100%" stop-color="#c8901a" />
    </linearGradient>
  </defs>
  <path d="M8 1.5 H92 Q98.5 1.5 98.5 8 V112 Q98.5 118.5 92 118.5 H8 Q1.5 118.5 1.5 112 V8 Q1.5 1.5 8 1.5 Z"
        fill="none" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round" />
  <!-- A fine inner line, like the edge of a foil card. -->
  <path d="M10.5 5.5 H89.5 Q94.5 5.5 94.5 10.5 V109.5 Q94.5 114.5 89.5 114.5 H10.5 Q5.5 114.5 5.5 109.5 V10.5 Q5.5 5.5 10.5 5.5 Z"
        fill="none" stroke="#fff6cf" stroke-opacity="0.55" stroke-width="0.7" />
  <!-- Corner gems. -->
  <g fill="#fff8d6">
    <path d="M6 2 L8.4 6 L6 10 L3.6 6 Z" /><path d="M94 2 L96.4 6 L94 10 L91.6 6 Z" />
    <path d="M6 110 L8.4 114 L6 118 L3.6 114 Z" /><path d="M94 110 L96.4 114 L94 118 L91.6 114 Z" />
  </g>
  <!-- Four-point sparkles on the frame. -->
  <g fill="#fff8d6">
    <path d="M94.5 28.5 L95.8 32.7 L100 34 L95.8 35.3 L94.5 39.5 L93.2 35.3 L89 34 L93.2 32.7 Z" />
    <path d="M4.5 58 L5.3 60.7 L8 61.5 L5.3 62.3 L4.5 65 L3.7 62.3 L1 61.5 L3.7 60.7 Z" />
    <path d="M93 74.8 L93.8 77.2 L96.2 78 L93.8 78.8 L93 81.2 L92.2 78.8 L89.8 78 L92.2 77.2 Z" />
  </g>
</svg>
